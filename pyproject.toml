[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-ghoster"
dynamic = ["version"]
description = "GPU-drawn pose ghosting for Autodesk Maya (Viewport 2.0, MUIDrawManager)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
authors = [{ name = "Clement Daures", email = "hello@clementdaures.com" }]
dependencies = ["Qt.py>=1.3.8"]

[project.urls]
Website = "https://clementdaures.com"

[dependency-groups]
dev = ["pytest", "black", "ruff"]

[tool.uv]
environments = ["python_version >= '3.9'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pose_ghoster.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py37"]

[tool.ruff]
line-length = 88
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "D2", "D3", "D4"]
ignore = ["D203", "D212", "D213", "D205", "D400", "D401", "D415", "D107", "D105", "D102", "D103", "D101", "D100", "D104"]